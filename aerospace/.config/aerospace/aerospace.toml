# AeroSpace Config

start-at-login = true

# Start JankyBorders with AeroSpace for focused window highlight
after-startup-command = ['exec-and-forget borders active_color=0xff58a6ff inactive_color=0xff494d64 width=8.0']

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps between windows
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

# ── Main bindings ───────────────────────────────────────────────────────────
# Prefix = alt. Colemak-DH: mnei = physical hjkl (right home row) = directions.
[mode.main.binding]

# Focus window
alt-m = 'focus left'
alt-n = 'focus down'
alt-e = 'focus up'
alt-i = 'focus right'

# Switch workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Enter move mode (border orange)
alt-shift-m = ['exec-and-forget borders active_color=0xffff9e64', 'mode move']

# Window ops (single-shot)
alt-h = 'fullscreen'
alt-b = 'balance-sizes'
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# ── Move mode ───────────────────────────────────────────────────────────────
# Unified mode. Sticky.
#   mnei          → focus window       shift+mnei    → move window
#   ctrl+mnei     → join with pane in direction (restructure tree)
#   arrows        → focus monitor      shift+arrows  → move to monitor
#   1-9           → switch workspace   shift+1-9     → move to workspace
#   h/v/a         → layout             f → float, x → flatten, r → reload
# Esc/enter exits.
[mode.move.binding]

# Windows — focus / move / join
m = 'focus left'
n = 'focus down'
e = 'focus up'
i = 'focus right'

shift-m = 'move left'
shift-n = 'move down'
shift-e = 'move up'
shift-i = 'move right'

ctrl-m = 'join-with left'
ctrl-n = 'join-with down'
ctrl-e = 'join-with up'
ctrl-i = 'join-with right'

# Monitors
left  = 'focus-monitor left'
down  = 'focus-monitor down'
up    = 'focus-monitor up'
right = 'focus-monitor right'
shift-left  = 'move-node-to-monitor --focus-follows-window left'
shift-down  = 'move-node-to-monitor --focus-follows-window down'
shift-up    = 'move-node-to-monitor --focus-follows-window up'
shift-right = 'move-node-to-monitor --focus-follows-window right'

# Workspaces
1 = 'workspace 1'
2 = 'workspace 2'
3 = 'workspace 3'
4 = 'workspace 4'
5 = 'workspace 5'
6 = 'workspace 6'
7 = 'workspace 7'
8 = 'workspace 8'
9 = 'workspace 9'
shift-1 = 'move-node-to-workspace 1'
shift-2 = 'move-node-to-workspace 2'
shift-3 = 'move-node-to-workspace 3'
shift-4 = 'move-node-to-workspace 4'
shift-5 = 'move-node-to-workspace 5'
shift-6 = 'move-node-to-workspace 6'
shift-7 = 'move-node-to-workspace 7'
shift-8 = 'move-node-to-workspace 8'
shift-9 = 'move-node-to-workspace 9'

# Layout / structure
h = 'layout tiles horizontal'
v = 'layout tiles vertical'
a = 'layout accordion horizontal vertical'
f = 'layout floating tiling'
b = 'balance-sizes'
x = 'flatten-workspace-tree'
w = 'close'
r = 'reload-config'

esc   = ['exec-and-forget borders active_color=0xff58a6ff', 'mode main']
enter = ['exec-and-forget borders active_color=0xff58a6ff', 'mode main']
