# AeroSpace Config

# Start AeroSpace at login
start-at-login = true

# Start JankyBorders with AeroSpace for focused window highlight
after-startup-command = ['exec-and-forget borders active_color=0xff58a6ff inactive_color=0xff494d64 width=8.0']

# Normalizations
# See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps between windows
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

# Main keybindings
[mode.main.binding]

# Focus windows: alt + hjkl (like ctrl+hjkl in tmux)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows: alt + shift + hjkl
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Join windows (like prefix+v / prefix+s splits in tmux)
alt-v = 'join-with right'
alt-s = 'join-with down'

# Resize windows: alt + shift + minus/equal
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Switch between workspaces: alt + number (like prefix+number in tmux)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace: alt + shift + number
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Fullscreen (like shift+escape zoom in tmux)
alt-m = 'fullscreen'

# Layout controls
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Float/unfloat
alt-shift-f = 'layout floating tiling'

# Balance window sizes
alt-shift-b = 'balance-sizes'

# Focus monitor: alt + ctrl + h/l
alt-ctrl-h = 'focus-monitor left'
alt-ctrl-l = 'focus-monitor right'

# Move window to monitor: alt + ctrl + shift + h/l
alt-ctrl-shift-h = 'move-node-to-monitor --focus-follows-window left'
alt-ctrl-shift-l = 'move-node-to-monitor --focus-follows-window right'

# Enter service mode: alt + shift + semicolon
alt-shift-semicolon = 'mode service'

# Service mode for less common actions
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
