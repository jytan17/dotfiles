# tmux configuration -- migrated from zellij with matching keybinds.
# Prefix: Ctrl-Space. Stow target: ~/.config/tmux/tmux.conf.

# =====================================================================
# Server / terminal
# =====================================================================

# Inside tmux: tmux-256color so nvim sees a known TERM with truecolor support.
set -g default-terminal "tmux-256color"

# Outer terminal (Ghostty) advertises truecolor, undercurl (usstyle), hyperlinks.
# Wildcard *:RGB:usstyle covers cases where xterm-ghostty terminfo isn't present.
set -as terminal-features ",xterm-ghostty:RGB:usstyle:hyperlinks"
set -as terminal-features ",xterm-256color:RGB:usstyle:hyperlinks"
set -as terminal-features ",*:RGB:usstyle"

# Explicit undercurl escape sequences (belt + braces; usstyle should imply these).
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow Kitty graphics protocol passthrough (yazi image preview in Ghostty).
set -g allow-passthrough on

# Sensible defaults
set -g focus-events on            # nvim autoread / FocusGained
set -sg escape-time 0             # nvim ESC latency
set -g  repeat-time 600           # window for repeated `-r` keys (resize arrows)
set -g mouse on
set -g history-limit 50000
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g detach-on-destroy off      # jump to next session instead of exit
set -g display-time 2000          # status messages stay 2s

# Window auto-rename: always show directory basename (stable, no flicker on focus)
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# =====================================================================
# Prefix
# =====================================================================

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# =====================================================================
# Pane / window navigation -- nvim-aware via vim-tmux-navigator
# =====================================================================
# Bindings provided by christoomey/vim-tmux-navigator plugin (see TPM section).
# They detect nvim/vim in the pane and forward Ctrl-h/j/k/l to the editor.

# Resize panes: prefix + arrow keys, repeatable.
# After prefix, tap arrows freely within repeat-time (600ms) -- no need to re-press prefix.
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# =====================================================================
# Prefix-mode bindings (mirror zellij's "tmux mode")
# =====================================================================

# --- Splits ---
unbind '"'
unbind %
bind  '|' split-window -h -c "#{pane_current_path}"
bind  '-' split-window -v -c "#{pane_current_path}"
# tmux has no native stacked/accordion. Closest: main-vertical layout.
bind  '=' select-layout -E              # even out splits on current axis

# --- Pane control ---
bind m  resize-pane -Z                                # zoom toggle
bind x  kill-pane
bind n  select-pane -t :.+                            # next pane
bind p  select-pane -t :.-                            # previous pane
bind H  swap-pane -s '{left-of}'
bind J  swap-pane -s '{down-of}'
bind K  swap-pane -s '{up-of}'
bind L  swap-pane -s '{right-of}'
bind '[' swap-pane -U                                 # move pane backwards in window
bind ']' swap-pane -D                                 # move pane forwards in window
bind '.' command-prompt -p "Pane title:" "select-pane -T '%%'"

# --- Tabs (windows) ---
bind c  new-window -c "#{pane_current_path}"
bind X  kill-window
bind 1  select-window -t :=1
bind 2  select-window -t :=2
bind 3  select-window -t :=3
bind 4  select-window -t :=4
bind 5  select-window -t :=5
bind 6  select-window -t :=6
bind 7  select-window -t :=7
bind 8  select-window -t :=8
bind 9  select-window -t :=9
bind Space last-window
bind '$' command-prompt -I "#W" "rename-window '%%'"

# --- Floating (native popup, no plugin) ---
# `prefix + f` opens a floating shell. Ctrl-d or `exit` closes it cleanly.
# No persistent session -- simple and avoids detach-on-destroy side effects.
bind f display-popup -E -w 85% -h 85% -d "#{pane_current_path}"
bind F  break-pane -d                                  # detach pane to its own window

# --- Pane stash (Zellij-like stacked panes) ---
# Hidden `_stash` window holds parked panes. swap-pane trades the focused pane
# with a stash pane so both keep running. Workflow: nvim on left, right pane
# swaps between Claude Code / scripts / logs via menu or Tab-cycle.
#
# prefix + S  -- park focused pane into stash (creates _stash window if needed)
# prefix + s  -- pick a stash pane to swap in (dynamic menu shows pane command)
# prefix + Tab -- cycle: swap next stash pane into current slot
bind S run-shell "$HOME/.config/tmux/scripts/stash_park.sh"
bind s run-shell "$HOME/.config/tmux/scripts/stash_menu.sh"
bind Tab run-shell "$HOME/.config/tmux/scripts/stash_cycle.sh"

# --- Layouts ---
bind /  next-layout
# Toggle pane border title visibility (zellij "frames" rough analogue).
bind b  if -F '#{==:#{pane-border-status},top}' \
            'set pane-border-status off' \
            'set pane-border-status top'

# --- Session / misc ---
# `w` is the @sessionx-bind; sessionx replaces choose-tree with an fzf picker
# that integrates zoxide, last-used sorting, and project preview.
bind d  detach-client
bind e  run-shell 'f="$(mktemp -t tmux-scrollback.XXXXXX)"; tmux capture-pane -p -S -50000 > "$f"; tmux new-window "$EDITOR \"$f\""'


# --- Copy mode ---
bind '['     copy-mode
bind -T copy-mode-vi v       send-keys -X begin-selection
bind -T copy-mode-vi y       send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter   send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape  send-keys -X cancel
bind -T copy-mode-vi C-d     send-keys -X halfpage-down
bind -T copy-mode-vi C-u     send-keys -X halfpage-up

# Reload config. Also re-runs catppuccin so `@catppuccin_*` changes take effect
# without a server restart -- the plugin bakes its vars into status formats at
# load time, so a plain `source-file` alone won't refresh window/status styling.
bind R source-file "$HOME/.config/tmux/tmux.conf" \; \
       run "$HOME/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux" \; \
       display "Config reloaded"

# =====================================================================
# Plugins (TPM)
# =====================================================================
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'catppuccin/tmux#v2.3.0'



# vim-tmux-navigator: it sets Ctrl-h/j/k/l itself; nothing more needed here.



# Session picker: native choose-tree (replaces removed tmux-sessionx).
bind w choose-tree -Zs

# =====================================================================
# Status bar + borders -- catppuccin (mocha, rounded)
# =====================================================================

# Borders -- mocha palette hardcoded (style strings don't expand @thm_* vars).
set -g pane-border-lines        single
set -g pane-border-style        'fg=#45475a'         # mocha surface_1
set -g pane-active-border-style 'fg=#cba6f7'         # mocha mauve

# Bar position / justify -- windows centred, status-left/right anchor edges.
set -g status-position top
set -g status-justify  centre

# Catppuccin theme + window styling. Read by the plugin when it loads.
set -g @catppuccin_flavor                 'mocha'
set -g @catppuccin_window_status_style    'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_flags           'icon'
# Show tmux's window name (`#W`). automatic-rename fills it with the cwd
# basename until you rename manually -- after that, tmux freezes the manual
# name for that window (auto-rename auto-disables per window on rename).
set -g @catppuccin_window_current_text    '#W'
set -g @catppuccin_window_text            '#W'

# date_time module -- override to clock only, no date.
set -g @catppuccin_date_time_text '%H:%M'

# Popup (native floating shell, see `bind f` above) -- mauve to match active border
set -g popup-border-lines single
set -g popup-border-style 'fg=#cba6f7'
set -g popup-style        'bg=default'

# Initialize TPM (must run before any post-plugin overrides below)
run "$HOME/.config/tmux/plugins/tpm/tpm"

# =====================================================================
# Post-plugin: status line assembly (uses catppuccin format vars)
# =====================================================================
# Minimal: session on the left, clock on the right, windows centred (justify).
# `set -ag` appends; `-F` expands the value as a format string so the
# `#{E:...}` indirections resolve to catppuccin's themed module strings.
set -g  status-left ""
set -ag status-left "#{E:@catppuccin_status_session}"

set -g  status-right ""
set -agF status-right "#{E:@catppuccin_status_date_time}"

# =====================================================================
# Post-plugin overrides
# =====================================================================
# nvim-aware Ctrl-h/j/k/l. Same is_vim regex as vim-tmux-navigator -- when the
# focused pane is running nvim/vim/fzf, forward the key into it; otherwise move
# panes. Hard stop at edges (no wrap) so direction matches physical layout.

is_vim="ps -o state=,comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'if -F "#{pane_at_left}"   "" "select-pane -L"'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'if -F "#{pane_at_bottom}" "" "select-pane -D"'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'if -F "#{pane_at_top}"    "" "select-pane -U"'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'if -F "#{pane_at_right}"  "" "select-pane -R"'
