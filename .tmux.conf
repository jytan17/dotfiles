set-option -sa terminal-overrides ",xterm*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
set-option -g default-command "zsh -l"
set-option -g mouse on
set-option -g focus-events on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
# set vi-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Key binding
bind -n S-Escape resize-pane -Z
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind t display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch"
# Open Panes in current directory
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# vim-tmux-navigator (no-wrap)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if "$is_vim" "send C-h" "if -F '#{pane_at_left}' '' 'select-pane -L'"
bind -n C-j if "$is_vim" "send C-j" "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind -n C-k if "$is_vim" "send C-k" "if -F '#{pane_at_top}' '' 'select-pane -U'"
bind -n C-l if "$is_vim" "send C-l" "if -F '#{pane_at_right}' '' 'select-pane -R'"
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"

# Window tabs: show just directory name (number is already shown by catppuccin)
set -g @catppuccin_window_text " /#{b:pane_current_path}"
set -g @catppuccin_window_current_text " /#{b:pane_current_path}"

# Load catppuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Dim inactive panes (using 'default' bg to preserve terminal transparency)
set -g window-style 'fg=#7f849c,bg=default'
set -g window-active-style 'fg=#cdd6f4,bg=default'

# Make pane borders more visible
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'
# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

# Status right: only show current application (zsh, nvim, etc.)
set -g status-right "#{E:@catppuccin_status_application}"

run '~/.tmux/plugins/tpm/tpm'
