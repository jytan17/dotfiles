[font]
size = 15

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[colors]
# Catppuccin Mocha
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#15152a"
foreground = "#cdd6f4"

[colors.cursor]
cursor = "#f5e0dc"
text = "#1e1e2e"

[colors.vi_mode_cursor]
cursor = "#f5e0dc"
text = "#1e1e2e"

[colors.selection]
background = "#585b70"
text = "#cdd6f4"

[colors.search.matches]
background = "#f9e2af"
foreground = "#1e1e2e"

[colors.search.focused_match]
background = "#a6e3a1"
foreground = "#1e1e2e"

[colors.footer_bar]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.hints.start]
background = "#f9e2af"
foreground = "#1e1e2e"

[colors.hints.end]
background = "#f9e2af"
foreground = "#1e1e2e"

[colors.line_indicator]
background = "None"
foreground = "None"

