[font]
size = 15

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.cursor]
cursor = "#c0caf5"
text = "#1a1b26"

[colors.vi_mode_cursor]
cursor = "#c0caf5"
text = "#1a1b26"

[colors.selection]
background = "#444b6a"
text = "#c0caf5"

[colors.search.matches]
background = "#ff9e64"
foreground = "#1a1b26"

[colors.search.focused_match]
background = "#ff9e64"
foreground = "#1a1b26"

[colors.footer_bar]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.hints.start]
background = "#ff9e64"
foreground = "#1a1b26"

[colors.hints.end]
background = "#ff9e64"
foreground = "#1a1b26"

[colors.line_indicator]
background = "None"
foreground = "None"

[colors.normal]
black = "#15161E"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
magenta = "#bb9af7"
red = "#f7768e"
white = "#a9b1d6"
yellow = "#e0af68"

[colors.bright]
black = "#444b6a"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
magenta = "#bb9af7"
red = "#f7768e"
white = "#c0caf5"
yellow = "#e0af68"
