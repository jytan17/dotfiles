gui:
  nerdFontsVersion: "3"
  showFileTree: true
  showRandomTip: false
git:
  autoFetch: true
  mainBranches:
    - main
    - master
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
os:
  edit: 'nvim --cmd "let g:lazygit=1" {{filename}}'
  editAtLine: 'nvim --cmd "let g:lazygit=1" +{{line}} {{filename}}'
