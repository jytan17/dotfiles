# Starship - Plain Text Preset + Catppuccin Mocha colors
# Mocha palette reference:
#   Text: #cdd6f4  Blue: #89b4fa  Green: #a6e3a1  Red: #f38ba8
#   Yellow: #f9e2af  Mauve: #cba6f7  Peach: #fab387  Teal: #94e2d5
#   Surface2: #585b70  Lavender: #b4befe  Sapphire: #74c7ec  Pink: #f5c2e7

"$schema" = 'https://starship.rs/config-schema.json'

continuation_prompt = "[.](bright-black) "

[character]
success_symbol = "[>](bold #a6e3a1)"
error_symbol = "[x](bold #f38ba8)"
vimcmd_symbol = "[<](bold #a6e3a1)"
vimcmd_visual_symbol = "[<](bold #f9e2af)"
vimcmd_replace_symbol = "[<](bold #cba6f7)"
vimcmd_replace_one_symbol = "[<](bold #cba6f7)"

[directory]
style = "bold #89b4fa"
read_only = " ro"

[git_branch]
symbol = "git "
style = "bold #a6e3a1"
truncation_symbol = "..."

[git_commit]
tag_symbol = " tag "

[git_status]
style = "#f9e2af"
ahead = ">"
behind = "<"
diverged = "<>"
renamed = "r"
deleted = "x"

[cmd_duration]
style = "#cba6f7"

[aws]
symbol = "aws "
style = "#f9e2af"

[azure]
symbol = "az "
style = "#89b4fa"

[battery]
